name: DevOps local preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      QA_USE_LOCAL_TEST_DATA: '0'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies on the isolated runner
        run: npm ci

      - name: Run local read-only preflight
        run: npm run devops:preflight
